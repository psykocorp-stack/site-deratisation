<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="red1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <!-- Réticule extérieur (cercle cible) -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.3"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.2"/>
  <!-- Lignes de visée croisées -->
  <line x1="40" y1="200" x2="360" y2="200" stroke="url(#red1)" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="40" x2="200" y2="360" stroke="url(#red1)" stroke-width="2" opacity="0.6"/>
  <!-- Réticule centre -->
  <circle cx="200" cy="200" r="60" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="200" cy="200" r="3" fill="#f59e0b"/>
  <!-- Rat ciblé au centre (vue de dessus) -->
  <g transform="translate(200,200)" fill="none" stroke="#0a1628" stroke-width="4" stroke-linecap="round">
    <ellipse cx="0" cy="0" rx="25" ry="12" fill="#0a1628" opacity="0.1"/>
    <path d="M-20 -5 L-35 -15 Q-40 -20 -38 -12" stroke-width="3"/>
    <path d="M-20 5 L-35 15 Q-40 20 -38 12" stroke-width="3"/>
    <!-- Oreilles -->
    <circle cx="-18" cy="-12" r="6" stroke-width="3"/>
    <circle cx="-18" cy="12" r="6" stroke-width="3"/>
    <!-- Queue -->
    <path d="M25 0 Q40 -10 50 0" stroke-width="3"/>
    <!-- Oeil central -->
    <circle cx="-12" cy="0" r="2" fill="#0a1628"/>
  </g>
</svg>
