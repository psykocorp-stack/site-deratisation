<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" rx="60" fill="#0a1628"/>
  <!-- Lettre D épaisse -->
  <g transform="translate(200,200)" stroke="white" stroke-width="14" fill="none">
    <!-- Barre verticale du D -->
    <line x1="-65" y1="-105" x2="-65" y2="105" stroke-linecap="round"/>
    <!-- Courbe du D -->
    <path d="M-65 -105 Q90 -105 90 0 Q90 105 -65 105" stroke-linecap="round"/>
  </g>
  <!-- Croix (+) dans l'oeil du D -->
  <line x1="20" y1="-12" x2="20" y2="12" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
  <line x1="8" y1="0" x2="32" y2="0" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
  <!-- 4 points = 4 nuisibles dans les quadrants du + -->
  <circle cx="20" cy="-25" r="4" fill="#f59e0b" opacity="0.5"/>
  <circle cx="20" cy="25" r="4" fill="#f59e0b" opacity="0.5"/>
  <circle cx="-5" cy="0" r="4" fill="#f59e0b" opacity="0.5"/>
  <circle cx="45" cy="0" r="4" fill="#f59e0b" opacity="0.5"/>
</svg>
